# ====================================================================
# Configuración del Motor de Reglas WAF (Coraza / ModSecurity + CRS)
# Taller WAAP - Fase 2: Implementación de la capa base WAF/WAAP
# ====================================================================

# Habilitar motor de reglas en modo On (bloqueo activo) o DetectionOnly
SecRuleEngine On

# Límites de cuerpo de solicitud
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Límite de respuesta
SecResponseBodyAccess Off

# Configuración de Logging de Auditoría
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# Nivel de Paranoia CRS (PL1 a PL4, configurable para Fase 2)
# PL1: Reglas básicas de alta fidelidad y mínimo falsos positivos
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# Regla de prueba básica para verificación de inyección SQL clásica
SecRule ARGS "@rx (?i)(?:--|\bOR\b\s+['\"]?1['\"]?\s*=\s*['\"]?1|union\s+select)" \
  "id:100001,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   msg:'WAAP Core Rule Engine: Intento de Inyeccion SQL detectado (Fase 2)'"

# Regla de prueba para Cross-Site Scripting (XSS)
SecRule ARGS "@rx (?i)<script.*?>.*?</script.*?>" \
  "id:100002,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   msg:'WAAP Core Rule Engine: Intento de XSS detectado (Fase 2)'"

