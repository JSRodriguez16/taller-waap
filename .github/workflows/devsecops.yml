# .github/workflows/devsecops.yml — Pipeline CI/CD DevSecOps con puertas de calidad de seguridad
# Taller WAAP: Fase 5 - Pipeline DevSecOps

name: devsecops-pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. SAST - Static Application Security Testing
      - name: SAST - Semgrep
        run: |
          pip install semgrep
          # Escanea patrones inseguros con reglas OWASP Top 10
          semgrep --config=p/owasp-top-ten app/ --error

      # 2. SCA - Software Composition Analysis
      - name: SCA - pip-audit
        run: |
          pip install pip-audit
          # Analiza vulnerabilidades conocidas (CVE) en dependencias
          pip-audit -r app/requirements.txt

      # 3. Construcción de Contenedor
      - name: Build de la imagen de la aplicacion
        run: |
          docker build -t taller-waap/app:${{ github.sha }} ./app

      # 4. Container Scanning
      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'taller-waap/app:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # 5. IaC Scanning
      - name: IaC scan - Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          quiet: false
          soft_fail: false
          output_format: cli
          
      # 6. DAST - Dynamic Application Security Testing
      - name: Iniciar servicios para DAST
        run: |
          docker compose up -d juice-shop
          sleep 10

      - name: DAST - OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules: 'zap-baseline.conf'
          fail_action: false

      # 7. Despliegue de Reglas WAAP (Policy as Code)
      - name: Despliegue de reglas WAAP (solo si todo pasa)
        if: success()
        run: |
          chmod +x ./scripts/deploy_waap_rules.sh
          ./scripts/deploy_waap_rules.sh

