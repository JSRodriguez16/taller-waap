services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - '3000:3000'
    networks:
      - lab-net
    restart: unless-stopped

  rasp-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rasp-app
    ports:
      - '5000:5000'
    environment:
      - FLASK_ENV=production
      - RASP_ENABLED=true
    networks:
      - lab-net
    restart: unless-stopped

  waap-proxy:
    image: owasp/modsecurity-crs:nginx
    container_name: waap-proxy
    ports:
      - '8080:8080'
    environment:
      - BACKEND=http://juice-shop:3000
      - PORT=8080
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - BLOCKING_PARANOIA=1
    depends_on:
      - juice-shop
      - rasp-app
    networks:
      - lab-net
    volumes:
      - ./logs:/var/log/modsecurity
    restart: unless-stopped

networks:
  lab-net:
    name: lab-net
    driver: bridge